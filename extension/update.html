<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atualizar Nexus YouTube+</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f0f0f; color:#f1f1f1; font:15px/1.5 Roboto,Arial,sans-serif; }
  .card { width:min(460px,92vw); padding:26px; border:1px solid #ffffff22; border-radius:18px; background:#1a1a1a; box-shadow:0 12px 40px #000a; }
  .eyebrow { color:#7db8ff; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  h1 { margin:6px 0 4px; font-size:22px; }
  .versions { color:#aaa; font-size:13px; margin-bottom:14px; }
  #status { min-height:44px; margin:10px 0 14px; }
  #status.ok { color:#6ee7a0; } #status.err { color:#ff8a8a; }
  .bar { height:8px; border-radius:6px; background:#333; overflow:hidden; margin-bottom:16px; }
  .bar > div { width:0; height:100%; background:linear-gradient(90deg,#4f9cff,#3477f6); transition:width .15s; }
  button { border:0; border-radius:11px; padding:12px 18px; font:700 14px Roboto,Arial,sans-serif; color:#fff; background:linear-gradient(135deg,#4f9cff,#3477f6); cursor:pointer; }
  button.sec { background:#333; }
  button[hidden] { display:none; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  small { display:block; margin-top:14px; color:#888; line-height:1.45; }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Nexus YouTube+</div>
    <h1>Atualização automática</h1>
    <div class="versions" id="versions"></div>
    <div id="status" role="status" aria-live="polite">Verificando…</div>
    <div class="bar"><div id="progress"></div></div>
    <div class="actions">
      <button id="pickBtn" type="button" hidden>Selecionar a pasta da extensão</button>
      <button id="allowBtn" type="button" hidden>Permitir e atualizar</button>
      <button id="changeBtn" class="sec" type="button" hidden>Trocar pasta</button>
    </div>
    <small id="hint"></small>
  </main>
  <script src="updater.js"></script>
  <script src="update.js"></script>
</body>
</html>
